<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Money</title>
<link rel="manifest" href="/money.webmanifest"><meta name="theme-color" content="#0f1210"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Money"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="/lucide.min.js"></script>
<script src="/supabase.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#0f1210;--surface:#171b18;--elev:#1d221e;--elev2:#262c27;--hov:#2f362f;
--line:rgba(255,255,255,0.07);--line2:rgba(255,255,255,0.13);
--tx:#e9ede9;--dim:#9aa39c;--dim2:#69726a;
--vio:#46d187;--vio2:#74e3a6;--ind:#1f9d68;
--amb:#e8c06a;--grn:#46d187;--red:#f0857e;--cy:#63c7b0;
--saf:env(safe-area-inset-bottom,0px);
}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow:hidden;overscroll-behavior:none}
html,body{height:100%}
body{position:fixed;top:0;left:0;right:0;bottom:0;height:100vh;height:100dvh;background:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;overflow:hidden;display:flex;flex-direction:column;font-size:15px;-webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(1100px 600px at 85% -10%,rgba(70,209,135,0.10),transparent 60%),radial-gradient(900px 500px at 0% 110%,rgba(70,209,135,0.05),transparent 55%);pointer-events:none;z-index:0}
::selection{background:rgba(70,209,135,0.35)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(70,209,135,0.28);border-radius:4px}
h1,h2,h3,.disp{font-family:'Sora',sans-serif}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}

/* ---- top bar ---- */
.topbar{position:relative;z-index:5;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.tb-brand{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.tb-logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--ind),var(--vio));display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tb-logo i{width:20px;height:20px;color:#fff}
.tb-name{font-family:'Sora';font-weight:800;font-size:19px;letter-spacing:-.3px;line-height:1}
.tb-sub{font-size:11.5px;color:var(--dim2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.tb-icon{width:40px;height:40px;border-radius:11px;border:1px solid var(--line2);background:var(--surface);color:var(--dim);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;position:relative}
.tb-icon:hover{color:var(--tx);border-color:var(--line2);background:var(--elev)}
.tb-icon i{width:18px;height:18px}
.add-btn{background:linear-gradient(120deg,var(--ind),var(--vio));border:none;border-radius:12px;color:#fff;padding:0 16px;height:40px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:14px;transition:filter .18s;font-family:inherit}
.add-btn:hover{filter:brightness(1.12)}
.add-btn i{width:16px;height:16px}
#syncDot{position:absolute;bottom:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--dim2);border:1.5px solid var(--surface)}

/* ---- content ---- */
.content{position:relative;z-index:1;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.wrap{max-width:860px;margin:0 auto;padding:20px 20px calc(40px + var(--saf))}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.toolbar .ui-sel{min-width:160px}

.mny-scope{display:flex;gap:8px;margin-bottom:18px}
.mny-scope .sc{padding:8px 16px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--dim);cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
.mny-scope .sc.on{background:rgba(70,209,135,0.14);border-color:var(--vio);color:var(--vio2)}
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.kpi{background:var(--elev);border:1px solid var(--line2);border-radius:14px;padding:15px 16px}
.kpi .k-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim2);font-weight:700;margin-bottom:8px}
.kpi .k-val{font-family:'Sora';font-weight:800;font-size:22px;letter-spacing:-.5px;line-height:1}
.kpi .k-sub{font-size:11px;color:var(--dim2);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mny-sec{margin-bottom:26px}
.mny-sec .ms-title{font-family:'Sora';font-weight:700;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;margin-bottom:13px;display:flex;align-items:center;gap:7px}
.mny-sec .ms-title i{width:14px;height:14px}
.catbar{margin-bottom:11px}
.catbar .cb-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.catbar .cb-amt{font-weight:700;color:var(--tx);font-size:13px;font-variant-numeric:tabular-nums}
.catbar .cb-track{height:8px;border-radius:5px;background:var(--surface);overflow:hidden}
.catbar .cb-fill{height:100%;border-radius:5px;transition:width .3s}
.cat-chip{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;border:1px solid transparent;white-space:nowrap}
.biz-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--elev);margin-bottom:8px}
.biz-row .biz-name{font-weight:600;font-size:14px;color:var(--tx);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.biz-row .biz-sub{font-size:11.5px;color:var(--dim2);flex-shrink:0}
.biz-row .biz-net{font-family:'Sora';font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;flex-shrink:0;min-width:84px;text-align:right}
.txn-row{display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--elev);margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.txn-row:hover{border-color:var(--line2)}
.txn-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.txn-ico i{width:16px;height:16px}
.txn-main{flex:1;min-width:0}
.txn-merch{font-weight:600;font-size:14px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txn-meta{font-size:11.5px;color:var(--dim2);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.src-badge{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;padding:1px 6px;border-radius:5px;border:1px solid var(--line2);color:var(--dim2)}
.src-badge.email{color:var(--cy);border-color:rgba(99,199,176,0.4)}
.src-badge.sms{color:var(--amb);border-color:rgba(232,192,106,0.4)}
.txn-amt{font-family:'Sora';font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;flex-shrink:0}
.txn-amt.out{color:var(--tx)}
.txn-amt.in{color:var(--grn)}
.mny-empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:56px 20px;color:var(--dim2)}
@media(max-width:720px){.kpi-row{gap:8px}.kpi{padding:12px 11px}.kpi .k-val{font-size:17px}.kpi .k-label{font-size:9.5px}.kpi .k-sub{display:none}.biz-row .biz-sub{display:none}.wrap{padding:16px 15px calc(36px + var(--saf))}.tb-sub{display:none}}

/* ---- custom select ---- */
.ui-sel{position:relative;font-family:inherit}
.ui-sel-trig{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line2);border-radius:11px;color:var(--tx);padding:11px 13px;font-size:14.5px;cursor:pointer;text-align:left;font-family:inherit}
.ui-sel.open .ui-sel-trig{border-color:var(--vio)}
.ui-sel-trig .ui-sel-val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ui-sel-trig .ui-sel-car{width:16px;height:16px;color:var(--dim2);flex-shrink:0;transition:transform .18s;display:flex}
.ui-sel-trig .ui-sel-car i{width:16px;height:16px}
.ui-sel.open .ui-sel-trig .ui-sel-car{transform:rotate(180deg);color:var(--vio2)}
.ui-sel-panel{position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:75;background:var(--elev);border:1px solid var(--line2);border-radius:12px;box-shadow:0 16px 40px -12px rgba(0,0,0,0.65);max-height:240px;overflow-y:auto;padding:5px;display:none;animation:uiPop .16s ease}
.ui-sel.open .ui-sel-panel{display:block}
@keyframes uiPop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ui-sel-opt{padding:10px 12px;border-radius:8px;font-size:14px;color:var(--tx);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ui-sel-opt:hover{background:var(--hov)}
.ui-sel-opt.on{background:rgba(70,209,135,0.14);color:var(--vio2)}

/* ---- modal ---- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,9,12,0.72);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.modal-box{width:100%;max-width:460px;max-height:88vh;overflow-y:auto;background:var(--elev);border:1px solid var(--line2);border-radius:18px;padding:22px;animation:pop .24s cubic-bezier(.22,1,.36,1)}
.modal-title{font-family:'Sora';font-weight:700;font-size:17px;margin-bottom:16px;display:flex;align-items:center;gap:9px}
.modal-title i{width:19px;height:19px;color:var(--vio2)}
.f-label{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--dim2);font-weight:700;margin:14px 0 7px}
.f-label:first-of-type{margin-top:0}
.m-in{width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:11px;color:var(--tx);padding:11px 14px;font-size:14.5px;outline:none;font-family:inherit}
.m-in:focus{border-color:var(--vio)}.m-in::placeholder{color:var(--dim2)}
.seg{display:flex;gap:8px}
.seg .sg{flex:1;text-align:center;padding:10px;border-radius:11px;border:1px solid var(--line2);background:var(--surface);color:var(--dim);cursor:pointer;font-size:13.5px;font-weight:600;transition:all .15s}
.seg .sg.on{background:rgba(70,209,135,0.14);border-color:var(--vio);color:var(--vio2)}
.date-btn{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line2);border-radius:11px;color:var(--tx);padding:11px 14px;font-size:14.5px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:9px}
.date-btn i{width:16px;height:16px;color:var(--dim2)}
.m-actions{display:flex;gap:10px;margin-top:20px}
.m-btn{flex:1;border-radius:12px;padding:12px;font-weight:600;font-size:14px;cursor:pointer;border:1px solid var(--line2);background:var(--surface);color:var(--dim);font-family:inherit}
.m-btn:hover{background:var(--hov);color:var(--tx)}
.m-btn.primary{background:linear-gradient(120deg,var(--ind),var(--vio));border:none;color:#fff}
.m-btn.primary:hover{filter:brightness(1.12)}
.m-btn.danger{background:rgba(240,133,126,0.14);border-color:rgba(240,133,126,0.45);color:var(--red)}
.m-btn.danger:hover{background:rgba(240,133,126,0.24);color:var(--red)}
.icon-btn{flex:0 0 auto;width:46px;display:flex;align-items:center;justify-content:center}
.icon-btn i{width:17px;height:17px}

/* ---- date picker ---- */
.dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.dp-title{font-family:'Sora';font-weight:700;font-size:16px}
.dp-nav{display:flex;gap:6px}
.dp-nav button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center}
.dp-nav button:hover{color:var(--tx);background:var(--hov)}
.dp-nav button i{width:16px;height:16px}
.dp-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.dp-dow span{text-align:center;font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--dim2);padding:4px 0}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dp-cell{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--tx);cursor:pointer;border:1px solid transparent}
.dp-cell:hover{background:var(--hov)}
.dp-cell.other{color:var(--dim2);opacity:.5}
.dp-cell.today{border-color:var(--line2)}
.dp-cell.sel{background:var(--vio);color:#0d0e12;border-color:var(--vio)}
.dp-foot{display:flex;gap:10px;margin-top:14px}

/* ---- toast ---- */
#toast{position:fixed;left:50%;bottom:calc(26px + var(--saf));transform:translateX(-50%) translateY(20px);z-index:90;background:var(--elev2);border:1px solid var(--line2);border-radius:12px;padding:12px 18px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;box-shadow:0 16px 40px -12px rgba(0,0,0,0.7);opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast i{width:17px;height:17px;color:var(--vio2);flex-shrink:0}
.banner{background:rgba(232,192,106,0.12);border:1px solid rgba(232,192,106,0.4);color:var(--amb);border-radius:12px;padding:11px 14px;font-size:13px;margin-bottom:16px;display:flex;gap:9px;align-items:center}
.banner i{width:16px;height:16px;flex-shrink:0}
.hidden{display:none!important}
/* KPI delta */
.k-delta{font-size:10px;font-weight:700;margin-top:5px;display:inline-flex;align-items:center;gap:3px}
.k-delta.up{color:var(--grn)}.k-delta.down{color:var(--red)}
.k-delta i{width:11px;height:11px}
/* section header with right meta */
.ms-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}
.ms-head .ms-title{margin-bottom:0}
.ms-meta{font-size:10.5px;color:var(--dim2);font-weight:600;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
/* trend chart */
.trend{display:flex;align-items:flex-end;gap:10px;height:128px;padding:4px 2px 0}
.trend-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;height:100%}
.trend-bars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.trend-bars .tb{width:12px;border-radius:4px 4px 0 0;min-height:2px;transition:height .3s}
.trend-bars .tb.in{background:var(--grn)}
.trend-bars .tb.out{background:rgba(240,133,126,0.85)}
.trend-x{font-size:10px;color:var(--dim2);font-weight:600;white-space:nowrap}
.trend-legend{display:flex;gap:16px;margin-top:13px;font-size:11px;color:var(--dim)}
.trend-legend span{display:inline-flex;align-items:center;gap:6px}
.trend-legend .dot{width:9px;height:9px;border-radius:3px;display:inline-block}
/* business P&L cards */
.pnl-card{border:1px solid var(--line2);background:var(--elev);border-radius:14px;padding:14px 15px;margin-bottom:10px}
.pnl-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.pnl-name{font-family:'Sora';font-weight:700;font-size:15px;color:var(--tx);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.margin-pill{flex-shrink:0;font-size:11px;font-weight:700;padding:3px 10px;border-radius:7px}
.pnl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.pnl-cell{background:var(--surface);border-radius:10px;padding:9px 11px}
.pnl-cell .pc-l{font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--dim2);font-weight:700;margin-bottom:5px}
.pnl-cell .pc-v{font-family:'Sora';font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
@media(max-width:720px){.pnl-cell .pc-v{font-size:13.5px}.pnl-grid{gap:7px}.pnl-cell{padding:8px 9px}}
/* filter bar */
.filterbar{display:flex;gap:9px;margin-bottom:6px;flex-wrap:wrap}
.fb-search{flex:1;min-width:150px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line2);border-radius:11px;padding:0 12px}
.fb-search i{width:15px;height:15px;color:var(--dim2);flex-shrink:0}
.fb-search input{flex:1;background:none;border:none;outline:none;color:var(--tx);font-size:14px;font-family:inherit;padding:10px 0;min-width:0}
.filterbar .ui-sel{min-width:140px;flex:0 0 auto}
/* day group header */
.day-group{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--dim2);margin:16px 0 9px;display:flex;justify-content:space-between;align-items:center}
.day-group .dg-sum{font-variant-numeric:tabular-nums}
.list-empty{text-align:center;color:var(--dim2);padding:30px 10px;font-size:13px}
/* sample banner */
.sample-banner{background:rgba(139,156,240,0.12);border:1px solid rgba(139,156,240,0.4);color:#a9b6f5;border-radius:12px;padding:10px 12px 10px 14px;font-size:13px;margin-bottom:16px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.sample-banner .sb-x{background:rgba(139,156,240,0.18);border:1px solid rgba(139,156,240,0.45);color:#a9b6f5;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.sample-banner .sb-x:hover{background:rgba(139,156,240,0.3)}
.btn-ghost{display:inline-flex;align-items:center;gap:7px;background:var(--elev);border:1px solid var(--line2);color:var(--vio2);border-radius:11px;padding:11px 17px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:14px}
.btn-ghost:hover{border-color:var(--vio)}
.btn-ghost i{width:15px;height:15px}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-brand">
    <div class="tb-logo"><i data-lucide="wallet"></i></div>
    <div style="min-width:0">
      <div class="tb-name">Money</div>
      <div class="tb-sub" id="tbSub">Loading…</div>
    </div>
  </div>
  <div class="tb-actions">
    <a class="tb-icon" href="/index.html" title="Back to HQ"><i data-lucide="layout-grid"></i></a>
    <button class="tb-icon" id="syncBtn" onclick="forceSync()" title="Sync now"><i data-lucide="refresh-cw"></i><span id="syncDot"></span></button>
    <button class="add-btn" onclick="openTxnModal()"><i data-lucide="plus"></i> Add</button>
  </div>
</div>

<div class="content">
  <div class="wrap">
    <div id="syncBanner" class="banner hidden"></div>
    <div class="toolbar">
      <div class="ui-sel" id="moneyPeriodSel"></div>
    </div>
    <div id="moneyBody"></div>
  </div>
</div>

<!-- transaction modal -->
<div class="modal" id="txnModal">
  <div class="modal-box">
    <div class="modal-title"><i data-lucide="receipt"></i> <span id="txnModalTitle">Add transaction</span></div>
    <div class="f-label">Direction</div>
    <div class="seg" id="segDir">
      <div class="sg" data-dir="out" onclick="pickTxnDir('out')">Money out</div>
      <div class="sg" data-dir="in" onclick="pickTxnDir('in')">Money in</div>
    </div>
    <div class="f-label">Amount</div>
    <input class="m-in" id="txnAmount" type="number" inputmode="decimal" step="0.01" placeholder="0.00">
    <div class="f-label">Merchant / description</div>
    <input class="m-in" id="txnMerchant" placeholder="e.g. Amazon, Shell, client payment">
    <div class="f-label">Type</div>
    <div class="seg" id="segType">
      <div class="sg" data-type="personal" onclick="pickTxnType('personal')">Personal</div>
      <div class="sg" data-type="business" onclick="pickTxnType('business')">Business</div>
    </div>

var SB_URL="https://szdrpdjyordvqtkuuazh.supabase.co",SB_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6ZHJwZGp5b3JkdnF0a3V1YXpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4MDAxMzgsImV4cCI6MjA4MjM3NjEzOH0.7rHx3HXaqe1h7q3y79nMwuXbOR9CcmWrY3WKXFjk8yM";

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function mid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dStr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

function live(arr){return (arr||[]).filter(function(x){return x&&!x.del})}
function fmtMoney(n){var v=Math.abs(Number(n)||0);return "$"+v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtDateLabel(iso){if(!iso)return"";var d=new Date(iso+"T12:00:00");if(isNaN(d))return"";return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"})}
var LABEL_PALETTE=[[99,199,176],[240,133,126],[232,192,106],[139,156,240],[208,139,224],[95,176,232],[111,211,138],[232,154,106],[122,196,210],[224,160,120]];
function labelColor(name){var s=String(name||"");var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;var c=LABEL_PALETTE[h%LABEL_PALETTE.length];return{fg:"rgb("+c[0]+","+c[1]+","+c[2]+")",bg:"rgba("+c[0]+","+c[1]+","+c[2]+",0.14)",bd:"rgba("+c[0]+","+c[1]+","+c[2]+",0.30)"}}

var CAT_PERSONAL=["Groceries","Dining","Gas","Transportation","Shopping","Utilities","Housing","Insurance","Health","Entertainment","Subscriptions","Travel","Fees","Transfer","Income","Other"];
var CAT_BUSINESS=["Software","Telephony","AI & Compute","Hosting","Advertising","Contractors","Office","Payments","Fees","Transfer","Income","Other"];

/* ---------- state ---------- */
var S={transactions:[],ventures:[]};
function normalizeTxn(arr){if(!Array.isArray(arr))return[];return arr.map(function(t){var ts=(t.ts!=null?t.ts:(t.mtime||1));return{id:t.id||mid(),amount:(Math.round((Number(t.amount)||0)*100)/100),direction:(t.direction==="in"?"in":"out"),merchant:t.merchant||"",category:t.category||"Other",account:t.account||"",sender:t.sender||"",business:(t.business||""),type:(/bus/i.test(String(t.type))?"business":"personal"),postedDate:(t.postedDate||null),note:t.note||"",raw:t.raw||"",source:(t.source==="manual"?"manual":(t.source==="email"?"email":"sms")),confidence:(t.confidence==null?null:Number(t.confidence)),sample:!!t.sample,del:!!t.del,ts:ts,mtime:(t.mtime!=null?t.mtime:ts)}})}

function loadLocal(){try{var d=localStorage.getItem("money_d");if(d){var p=JSON.parse(d);S.transactions=normalizeTxn(p.transactions||[]);S.ventures=(p.ventures||[])}}catch(e){}}
function saveLocal(){try{localStorage.setItem("money_d",JSON.stringify({transactions:S.transactions,ventures:S.ventures}))}catch(e){}}

/* ---------- sync status ---------- */
var lastSynced=0,lastSyncError="";
function setSync(state){var dot=document.getElementById("syncDot");var sub=document.getElementById("tbSub");
  var map={ok:"var(--grn)",saving:"var(--amb)",err:"var(--red)",local:"var(--dim2)"};
  if(dot)dot.style.background=map[state]||"var(--dim2)";
  if(sub){var n=live(S.transactions).length;
    if(state==="err")sub.textContent=(lastSyncError?("Sync issue: "+lastSyncError):"Sync issue, tap refresh");
    else if(state==="saving")sub.textContent="Saving…";
    else if(state==="local")sub.textContent="Offline · "+n+" on this device";
    else sub.textContent=n+" transaction"+(n===1?"":"s")+" · "+(rtConnected?"live":"synced");}
}
function showBanner(msg){var b=document.getElementById("syncBanner");if(b){b.innerHTML='<i data-lucide="alert-triangle"></i> '+msg;b.classList.remove("hidden");icons()}}
function clearBanner(){var b=document.getElementById("syncBanner");if(b)b.classList.add("hidden")}

/* ---------- sync engine (txn-only, v37-safe) ---------- */
var MIN_PULL_MS=2500,POLL_MS=5000,FULL_RECONCILE_MS=30000,PULL_TIMEOUT_MS=12000;
var lastPullAt=0,pullTimer=null,pullInFlight=false,rtConnected=false,ownWriteUntil=0,lastSeenUpdatedAt=null,lastFullPullAt=0,remoteLoaded=false;
var pushQueue={},pendingIds={},flushTimer=null,retryTimer=null;
function markOwnWrite(){ownWriteUntil=Date.now()+1200}
function noteUpdatedAt(rows){(rows||[]).forEach(function(r){var u=r&&r.updated_at;if(u&&(!lastSeenUpdatedAt||u>lastSeenUpdatedAt))lastSeenUpdatedAt=u})}

/* Merge remote rows into local state. Never eats a local edit:
   1) an item still queued to upload stays local
   2) a locally-newer item (bigger mtime) stays local
   3) a local-only item (no remote row) is kept and re-uploaded */
function applyRows(rows){
  var prevT={};(S.transactions||[]).forEach(function(x){if(x&&x.id)prevT[x.id]=x});
  var seen={},nextT=[],ventures=[];
  rows.forEach(function(r){
    if(r.kind==="venture"){var vd=r.data||{};if(vd&&vd.name&&!vd.deleted&&!r.deleted)ventures.push(vd.name);return}
    if(r.kind!=="txn")return;
    seen[r.id]=true;
    var d=r.data||{};d.id=r.id;d.del=!!r.deleted;
    var lh=prevT[r.id];
    if(lh&&(pendingIds[r.id]||((lh.mtime||0)>(d.mtime||0)))){nextT.push(lh);return}
    nextT.push(d);
  });
  var reupload=[];
  Object.keys(prevT).forEach(function(id){if(!seen[id]){nextT.push(prevT[id]);reupload.push(id)}});
  S.transactions=normalizeTxn(nextT);
  S.ventures=ventures;
  saveLocal();
  reupload.forEach(function(id){pushItem(id)});
  renderIfChanged();
}

var lastSig="";
function stateSignature(){var parts=[];live(S.transactions).forEach(function(x){parts.push(x.id+":"+(x.mtime||0)+":"+(x.del?1:0))});parts.sort();return parts.join("|")}
function renderIfChanged(){var s=stateSignature();if(s!==lastSig){lastSig=s;renderMoney()}setSync(lastSyncError?"err":"ok")}
function forceRender(){lastSig=stateSignature();renderMoney()}

function pullRemote(cb){
  if(!sb){remoteLoaded=true;setSync("local");if(cb)cb(false);return}
  var PAGE=1000,acc=[];
  function page(from){
    var ctrl=(typeof AbortController!=="undefined")?new AbortController():null;
    var to=setTimeout(function(){if(ctrl){try{ctrl.abort()}catch(e){}}},PULL_TIMEOUT_MS);
    var q=sb.from("hq_items").select("*").eq("user_key","gibson").in("kind",["txn","venture"]).order("id",{ascending:true}).range(from,from+PAGE-1);
    if(ctrl&&q.abortSignal)q=q.abortSignal(ctrl.signal);
    q.then(function(res){
      clearTimeout(to);
      if(res.error){lastSyncError=(res.error.message||"read failed");remoteLoaded=true;setSync("err");if(cb)cb(false);return}
      var got=res.data||[];acc=acc.concat(got);
      if(got.length===PAGE){page(from+PAGE);return}
      lastFullPullAt=Date.now();noteUpdatedAt(acc);lastSyncError="";
      applyRows(acc);
      remoteLoaded=true;lastSynced=Date.now();clearBanner();setSync("ok");if(cb)cb(true,acc);
    }).catch(function(e){clearTimeout(to);lastSyncError=(e&&e.message)||"network error";remoteLoaded=true;setSync("err");if(cb)cb(false)});
  }
  page(0);
}

function requestPull(reason){
  if(!sb||!remoteLoaded)return;
  if(reason==="realtime"&&Date.now()<ownWriteUntil)return;
  var since=Date.now()-lastPullAt;
  if(pullInFlight)return;
  if(since<MIN_PULL_MS){if(pullTimer)return;pullTimer=setTimeout(function(){pullTimer=null;requestPull("debounced")},MIN_PULL_MS-since);return}
  lastPullAt=Date.now();pullInFlight=true;
  var wd=setTimeout(function(){pullInFlight=false},PULL_TIMEOUT_MS+3000); /* watchdog: a hung pull can never wedge sync */
  pullRemote(function(){clearTimeout(wd);pullInFlight=false});
}
function checkForChanges(){
  if(!sb||!remoteLoaded||document.visibilityState!=="visible")return;
  if(Date.now()-lastFullPullAt>FULL_RECONCILE_MS){requestPull("reconcile");return}
  var ctrl=(typeof AbortController!=="undefined")?new AbortController():null;
  var to=setTimeout(function(){if(ctrl){try{ctrl.abort()}catch(e){}}},PULL_TIMEOUT_MS);
  var q=sb.from("hq_items").select("updated_at").eq("user_key","gibson").order("updated_at",{ascending:false}).limit(1);
  if(ctrl&&q.abortSignal)q=q.abortSignal(ctrl.signal);
  q.then(function(res){clearTimeout(to);if(res.error||!res.data||!res.data.length)return;var top=res.data[0].updated_at;if(!lastSeenUpdatedAt||top>lastSeenUpdatedAt)requestPull("changed")}).catch(function(){clearTimeout(to)});
}

/* push a single transaction row (wire-identical to HQ) */
function pushItem(id){if(!id||!sb)return;var t=null,a=S.transactions||[];for(var i=0;i<a.length;i++){if(a[i]&&a[i].id===id){t=a[i];break}}if(!t)return;
  pendingIds[id]=true;
  pushQueue[id]={id:id,user_key:"gibson",kind:"txn",parent:null,deleted:!!t.del,data:JSON.parse(JSON.stringify(t))};
  flushQueue()}
function requeue(rows){rows.forEach(function(x){if(!pushQueue[x.id])pushQueue[x.id]=x});clearTimeout(retryTimer);retryTimer=setTimeout(function(){flushQueue()},3000)}
function flushQueue(){clearTimeout(flushTimer);flushTimer=setTimeout(function(){
  if(!sb)return;var rows=Object.keys(pushQueue).map(function(k){return pushQueue[k]});if(!rows.length)return;
  pushQueue={};setSync("saving");markOwnWrite();
  sb.from("hq_items").upsert(rows,{onConflict:"id"}).then(function(r){
    if(r.error){lastSyncError=(r.error.message||r.error.hint||"write rejected");setSync("err");requeue(rows)}
    else{rows.forEach(function(x){delete pendingIds[x.id]});lastSynced=Date.now();lastSyncError="";setSync("ok");requestPull("after-write")}
  }).catch(function(e){lastSyncError=(e&&e.message)||"network error during save";setSync("err");requeue(rows)});
},350)}
function flushPending(){var ids=Object.keys(pendingIds);if(ids.length)ids.forEach(function(id){pushItem(id)})}
function save(id){saveLocal();if(id)pushItem(id)}

var rtChan=null;
function startRealtime(){if(!sb)return;if(rtChan){try{sb.removeChannel(rtChan)}catch(e){}rtChan=null}rtConnected=false;
  try{rtChan=sb.channel("money").on("postgres_changes",{event:"*",schema:"public",table:"hq_items"},function(){if(Date.now()<ownWriteUntil)return;checkForChanges()}).subscribe(function(status){rtConnected=(status==="SUBSCRIBED")})}catch(e){rtConnected=false}}
function ensureRealtime(){if(sb&&!rtConnected)startRealtime()}
function startPolling(){setInterval(function(){if(!sb||!remoteLoaded)return;if(document.visibilityState!=="visible")return;ensureRealtime();checkForChanges()},POLL_MS)}

function forceSync(){if(!sb){toast("No cloud connection","alert-triangle");return}
  var btn=document.getElementById("syncBtn");if(btn)btn.style.opacity="0.5";setSync("saving");
  lastPullAt=Date.now();pullInFlight=true;
  var wd=setTimeout(function(){pullInFlight=false},PULL_TIMEOUT_MS+3000);
  pullRemote(function(ok){clearTimeout(wd);pullInFlight=false;if(btn)btn.style.opacity="1";toast(ok?("Synced · "+live(S.transactions).length+" transactions"):"Sync failed",ok?"check-circle":"alert-triangle")})}

function startCloud(){lastPullAt=Date.now();pullInFlight=true;
  var wd=setTimeout(function(){pullInFlight=false},PULL_TIMEOUT_MS+3000);
  pullRemote(function(){clearTimeout(wd);pullInFlight=false;remoteLoaded=true;startRealtime();startPolling()})}

document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"){ensureRealtime();flushPending();requestPull("visible")}});
window.addEventListener("focus",function(){ensureRealtime();flushPending();requestPull("focus")});
window.addEventListener("online",function(){ensureRealtime();flushPending();requestPull("online")});

/* ---------- render ---------- */
var moneyPeriod="month",moneyScope="all",txnSearch="",filterCat="all",filterBiz="all";
function txList(){return live(S.transactions)}
function txnTime(t){if(t.postedDate&&/^\d{4}-\d{2}-\d{2}$/.test(t.postedDate))return new Date(t.postedDate+"T12:00:00").getTime();return t.ts||0}
function monthLabel(m,y){return new Date(y,m,1).toLocaleString("en-US",{month:"long",year:"numeric"})}
function moneyRange(){var now=new Date(),y=now.getFullYear(),m=now.getMonth();
  if(moneyPeriod==="all")return{start:0,end:Infinity,label:"All time"};
  if(moneyPeriod==="30d")return{start:Date.now()-30*864e5,end:Infinity,label:"Last 30 days"};
  if(moneyPeriod==="year")return{start:new Date(y,0,1).getTime(),end:Infinity,label:String(y)};
  if(moneyPeriod==="lastmonth")return{start:new Date(y,m-1,1).getTime(),end:new Date(y,m,1).getTime(),label:monthLabel(m-1,y)};
  return{start:new Date(y,m,1).getTime(),end:Infinity,label:"This month"};}
function prevRange(){var now=new Date(),y=now.getFullYear(),m=now.getMonth();
  if(moneyPeriod==="month")return{start:new Date(y,m-1,1).getTime(),end:new Date(y,m,1).getTime()};
  if(moneyPeriod==="lastmonth")return{start:new Date(y,m-2,1).getTime(),end:new Date(y,m-1,1).getTime()};
  if(moneyPeriod==="30d")return{start:Date.now()-60*864e5,end:Date.now()-30*864e5};
  if(moneyPeriod==="year")return{start:new Date(y-1,0,1).getTime(),end:new Date(y,0,1).getTime()};
  return null;}
function inScopeType(t){if(moneyScope==="personal"&&t.type!=="personal")return false;if(moneyScope==="business"&&t.type!=="business")return false;return true}
function txnsInScope(){var r=moneyRange();return txList().filter(function(t){var d=txnTime(t);if(!(d>=r.start&&d<r.end))return false;return inScopeType(t)})}
function sumsFor(range){var inS=0,outS=0;txList().forEach(function(t){var d=txnTime(t);if(!(d>=range.start&&d<range.end))return;if(!inScopeType(t))return;if(t.direction==="in")inS+=t.amount;else outS+=t.amount});return{inS:inS,outS:outS}}
function srcBadge(t){if(t.source==="email")return '<span class="src-badge email">email</span>';if(t.source==="sms")return '<span class="src-badge sms">sms</span>';return ''}
function deltaHtml(cur,prev,goodUp){if(prev==null||prev===0)return'';var d=cur-prev;if(Math.abs(d)<0.005)return'';var pct=Math.round(Math.abs(d/prev)*100);var up=d>0;var good=(up===goodUp);return '<div class="k-delta '+(good?"up":"down")+'"><i data-lucide="'+(up?"trending-up":"trending-down")+'"></i>'+pct+'% vs prev</div>';}
function hasSample(){return txList().some(function(t){return t.sample})}

/* ---- 6-month in/out trend (scope-filtered, ignores the period selector) ---- */
function trendHtml(){
  var now=new Date(),months=[];
  for(var i=5;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({y:d.getFullYear(),m:d.getMonth(),inS:0,outS:0,label:d.toLocaleString("en-US",{month:"short"})})}
  txList().forEach(function(t){if(!inScopeType(t))return;var dt=new Date(txnTime(t));for(var i=0;i<months.length;i++){if(dt.getFullYear()===months[i].y&&dt.getMonth()===months[i].m){if(t.direction==="in")months[i].inS+=t.amount;else months[i].outS+=t.amount;break}}});
  var max=1;months.forEach(function(mm){max=Math.max(max,mm.inS,mm.outS)});
  if(max<=1)return'';
  var cols=months.map(function(mm){var hi=Math.max(2,Math.round(mm.inS/max*100)),ho=Math.max(2,Math.round(mm.outS/max*100));
    return '<div class="trend-col"><div class="trend-bars"><div class="tb in" style="height:'+hi+'%" title="In '+fmtMoney(mm.inS)+'"></div><div class="tb out" style="height:'+ho+'%" title="Out '+fmtMoney(mm.outS)+'"></div></div><div class="trend-x">'+mm.label+'</div></div>'}).join('');
  return '<div class="mny-sec"><div class="ms-head"><div class="ms-title"><i data-lucide="bar-chart-3"></i> 6-month trend</div></div><div class="trend">'+cols+'</div><div class="trend-legend"><span><i class="dot" style="background:var(--grn)"></i> Money in</span><span><i class="dot" style="background:rgba(240,133,126,0.85)"></i> Money out</span></div></div>';
}

/* ---- per-business P&L: revenue, expenses, profit, margin ---- */
function pnlHtml(all){
  var byBiz={};all.forEach(function(t){if(t.type!=="business")return;var k=t.business||"Unassigned";if(!byBiz[k])byBiz[k]={rev:0,exp:0};if(t.direction==="in")byBiz[k].rev+=t.amount;else byBiz[k].exp+=t.amount});
  var keys=Object.keys(byBiz);if(!keys.length)return'';
  keys.sort(function(a,b){return (byBiz[b].rev-byBiz[b].exp)-(byBiz[a].rev-byBiz[a].exp)});
  var h='<div class="mny-sec"><div class="ms-head"><div class="ms-title"><i data-lucide="briefcase"></i> Business P&amp;L</div><div class="ms-meta">revenue · expenses · profit</div></div>';
  keys.forEach(function(k){var b=byBiz[k];var profit=b.rev-b.exp;var margin=b.rev>0?Math.round(profit/b.rev*100):null;
    var mc=profit>=0?{c:"var(--grn)",bg:"rgba(70,209,135,0.14)"}:{c:"var(--red)",bg:"rgba(240,133,126,0.14)"};
    h+='<div class="pnl-card"><div class="pnl-head"><div class="pnl-name">'+esc(k)+'</div>'+(margin!=null?'<div class="margin-pill" style="color:'+mc.c+';background:'+mc.bg+'">'+margin+'% margin</div>':'')+'</div>'+
      '<div class="pnl-grid">'+
      '<div class="pnl-cell"><div class="pc-l">Revenue</div><div class="pc-v" style="color:var(--grn)">'+fmtMoney(b.rev)+'</div></div>'+
      '<div class="pnl-cell"><div class="pc-l">Expenses</div><div class="pc-v" style="color:var(--red)">'+fmtMoney(b.exp)+'</div></div>'+
      '<div class="pnl-cell"><div class="pc-l">Profit</div><div class="pc-v" style="color:'+(profit>=0?"var(--grn)":"var(--red)")+'">'+(profit>=0?"+":"-")+fmtMoney(profit)+'</div></div>'+
      '</div></div>';});
  return h+'</div>';
}

function renderMoney(){
  var ps=document.getElementById("moneyPeriodSel");
  if(ps&&!ps._ui)uiSelect(ps,[{value:"month",label:"This month"},{value:"lastmonth",label:"Last month"},{value:"30d",label:"Last 30 days"},{value:"year",label:"This year"},{value:"all",label:"All time"}],moneyPeriod,function(v){moneyPeriod=v;renderMoney()});
  var body=document.getElementById("moneyBody");if(!body)return;
  var all=txnsInScope();var r=moneyRange();
  var h=(hasSample()?'<div class="sample-banner"><span><i data-lucide="flask-conical" style="width:14px;height:14px;vertical-align:-2px"></i> Showing sample data for preview</span><button class="sb-x" onclick="clearSampleData()">Clear sample data</button></div>':'');

  return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});}

/* ---------- custom select ---------- */
function uiSelect(mount,options,value,onChange){
  mount.classList.add("ui-sel");mount.innerHTML="";
  var trig=document.createElement("button");trig.type="button";trig.className="ui-sel-trig";
  var val=document.createElement("span");val.className="ui-sel-val";
  var car=document.createElement("span");car.className="ui-sel-car";car.innerHTML='<i data-lucide="chevron-down"></i>';
  trig.appendChild(val);trig.appendChild(car);
  var panel=document.createElement("div");panel.className="ui-sel-panel";
  mount.appendChild(trig);mount.appendChild(panel);
  var cur=value,opts=options;
  function labelFor(v){for(var i=0;i<opts.length;i++)if(String(opts[i].value)===String(v))return opts[i].label;return ""}
  function paint(){val.textContent=labelFor(cur)||(opts[0]?opts[0].label:"")}
  function close(){mount.classList.remove("open");if(_openSel===ctrl)_openSel=null}
  function open(){if(_openSel&&_openSel!==ctrl)_openSel.close();mount.classList.add("open");_openSel=ctrl;var on=panel.querySelector(".ui-sel-opt.on");if(on&&on.scrollIntoView)on.scrollIntoView({block:"nearest"})}
  function build(){panel.innerHTML="";opts.forEach(function(o){var el=document.createElement("div");el.className="ui-sel-opt"+(String(o.value)===String(cur)?" on":"");el.textContent=o.label;el.onclick=function(ev){ev.stopPropagation();cur=o.value;paint();build();close();if(onChange)onChange(cur)};panel.appendChild(el)})}
  trig.onclick=function(ev){ev.stopPropagation();mount.classList.contains("open")?close():open()};
  var ctrl={close:close,get:function(){return cur},set:function(v){cur=v;paint();build()},setOptions:function(newOpts,v){opts=newOpts;if(v!==undefined)cur=v;paint();build()}};
  mount._ui=ctrl;paint();build();icons();return ctrl;
}

  else{remoteLoaded=true;setSync("local");showBanner("Could not load the sync library on this device. Your data is saved locally; tap refresh when back online.")}
}
boot();
</script>
